[package]
name = "freebox-download-client"
version = "2.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
description = "Freebox Download torrent client plugin"

[package.metadata.scryer]
official = true
plugin_id = "freebox"
status = "beta"
catalog_versions = ["v3"]
# Scryer 0.21.17 is the first release whose host accepts plugin SDK 3.16,
# which this artifact declares. Older releases reject it before
# registration (0.20.0 was the earlier floor, for the component host), so
# the floor is load-bearing, not advisory.
min_scryer_version = "0.21.17"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/freebox"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/freebox"

# A component, not a Preview 1 command binary: the world's `describe` and
# `process` are exported from the library itself, so there is no `main` and no
# `[[bin]]`. xtask's `select_built_wasm` already accepts either artifact name.
[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
hmac = "0.13"
scryer-plugin-sdk = "3.16.0"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
urlencoding = "2"
wit-bindgen = "0.61"

[dev-dependencies]
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "download-client",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
